<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>JOWTV</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#inicio" aria-label="Início">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="4" fill="currentColor"/><path d="M13 12.5v7l6-3.5z" fill="#0b0d12"/><path d="M11 3l5 4 5-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>JOW<b>TV</b></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Seções"></nav>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Buscar canal..." autocomplete="off" aria-label="Buscar canal">
      </label>
      <select id="country" aria-label="País"><option value="">🌍 Todos os países</option></select>
      <button class="icon-btn phone-btn" id="connectBtn" title="Assistir no celular / TV" aria-label="Assistir no celular ou TV">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Configurações" aria-label="Configurações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Carregando milhares de canais...</p>
      <small>Na primeira vez pode levar alguns segundos.</small>
    </div>
  </main>

  <!-- Player -->
  <div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="Player">
    <div class="player-inner">
      <div class="video-wrap">
        <video id="video" controls playsinline autoplay></video>
        <div class="video-status" id="videoStatus"></div>
        <button class="nav-arrow prev" id="prevCh" title="Canal anterior (←)" aria-label="Canal anterior">‹</button>
        <button class="nav-arrow next" id="nextCh" title="Próximo canal (→)" aria-label="Próximo canal">›</button>
      </div>
      <aside class="player-info">
        <div class="pi-head">
          <div class="pi-logo" id="piLogo"></div>
          <div>
            <h2 id="piName"></h2>
            <p id="piMeta"></p>
          </div>
          <button class="icon-btn close" id="closePlayer" title="Fechar (Esc)" aria-label="Fechar">✕</button>
        </div>
        <div class="pi-actions">
          <button class="btn" id="favBtn">☆ Favoritar</button>
          <button class="btn ghost" id="copyBtn">Copiar link (VLC)</button>
        </div>
        <h3>Fontes do sinal</h3>
        <div class="sources" id="sources"></div>
        <p class="hint">Se o canal não abrir, o player tenta a próxima fonte automaticamente. Alguns canais só funcionam em certos países.</p>
      </aside>
    </div>
  </div>

  <!-- Configurações -->
  <div class="modal" id="settings" hidden role="dialog" aria-modal="true" aria-label="Configurações">
    <div class="modal-box">
      <h2>Configurações</h2>
      <label class="switch"><input type="checkbox" id="optProxy"><span>Usar proxy do servidor <small>(recomendado: faz mais canais funcionarem)</small></span></label>
      <label class="switch"><input type="checkbox" id="optHd"><span>Mostrar só canais HD (720p ou mais)</span></label>
      <label class="switch"><input type="checkbox" id="optExtra"><span>Incluir streams sem cadastro <small>(canais não catalogados)</small></span></label>
      <label class="switch"><input type="checkbox" id="optNsfw"><span>Mostrar conteúdo adulto (+18)</span></label>
      <div class="modal-foot">
        <span id="catalogInfo"></span>
        <div>
          <button class="btn ghost" id="refreshBtn">Atualizar catálogo</button>
          <button class="btn" id="closeSettings">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Assistir no celular / TV -->
  <div class="modal" id="connect" hidden role="dialog" aria-modal="true" aria-label="Assistir no celular ou TV">
    <div class="modal-box connect-box">
      <button class="icon-btn close" id="closeConnect" title="Fechar" aria-label="Fechar">✕</button>
      <h2>📱 Assistir no celular ou TV</h2>
      <div class="connect-body" id="connectBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
